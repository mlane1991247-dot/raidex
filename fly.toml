# Fly.io config. Deploy:  fly launch  then  fly deploy
app = "raidex"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RAIDEX_DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "raidex_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
